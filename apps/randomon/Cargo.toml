[package]
name = "randomon"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A modern, cross-platform Pokémon game randomizer compatible with Universal Pokemon Randomizer ZX"

[dependencies]
iced = { version = "0.14", features = ["advanced", "image", "svg", "tokio"] }
rfd = "0.17"
open = "5.3"
log.workspace = true
env_logger.workspace = true

getrandom = "0.4"
randomon_settings.workspace = true
randomon_core.workspace = true
randomon_gen1.workspace = true
randomon_gen2.workspace = true
randomon_gen4.workspace = true
randomon_gen5.workspace = true
randomon_gen6.workspace = true
randomon_gen7.workspace = true
randomon_java.workspace = true
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
