[package]
name = "randomon"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A modern, cross-platform Pokémon game randomizer compatible with Universal Pokemon Randomizer ZX"

[dependencies]
iced = { version = "0.14", features = ["advanced", "image", "svg", "tokio"] }
rfd = "0.17"
open = "5.3"
log.workspace = true
env_logger.workspace = true

getrandom = "0.4"
randomon_settings.workspace = true
randomon_core.workspace = true
randomon_formats.workspace = true
randomon_gen1.workspace = true
randomon_gen2.workspace = true
randomon_gen4.workspace = true
randomon_gen3.workspace = true
randomon_gen5.workspace = true
randomon_gen6.workspace = true
randomon_gen7.workspace = true
randomon_java.workspace = true
randomon_bdsp.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_os = "windows"))'.dependencies]
ureq = "3"

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "NSRunningApplication"] }
dispatch2 = "0.3"

[dev-dependencies]
randomon_ctr.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
