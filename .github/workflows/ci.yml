name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev pkg-config
            - uses: Swatinem/rust-cache@v2
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-26, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev pkg-config
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --workspace
            - run: cargo build --workspace --release

    deny:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: EmbarkStudios/cargo-deny-action@v2

    check:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            bumped: ${{ steps.check.outputs.bumped }}
            version: ${{ steps.check.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Check version bump
              id: check
              run: |
                  CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
                  LATEST_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "0.0.0")
                  echo "Current: $CURRENT, Latest tag: $LATEST_TAG"
                  echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
                  if [ "$CURRENT" != "$LATEST_TAG" ] && [ "$(printf '%s\n' "$LATEST_TAG" "$CURRENT" | sort -V | tail -n1)" = "$CURRENT" ]; then
                    echo "bumped=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "bumped=false" >> "$GITHUB_OUTPUT"
                  fi

    release:
        needs: [check, lint, test, deny]
        if: github.event_name == 'push' && needs.check.outputs.bumped == 'true'
        uses: ./.github/workflows/release.yml
        secrets: inherit
        permissions:
            contents: write
