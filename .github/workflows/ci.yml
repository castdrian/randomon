name: CI

on:
    pull_request:
        branches: [main]
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow_ref }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0
    CARGO_PROFILE_TEST_DEBUG: 0
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev pkg-config
            - uses: Swatinem/rust-cache@v2
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-26, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev pkg-config
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --workspace

    deny:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-deny
            - run: cargo deny check
