name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main
    SEMANTIC_RELEASE: >-
        npx --yes
        -p semantic-release@25
        -p @semantic-release/changelog@7
        -p @semantic-release/exec@7
        -p @semantic-release/git@11
        -p conventional-changelog-conventionalcommits@10
        semantic-release

jobs:
    version:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.next.outputs.version }}
            build-number: ${{ steps.next.outputs.build-number }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - name: Work out the next version
              id: next
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $SEMANTIC_RELEASE --dry-run --no-ci
                  if [ -f .next-version ]; then
                    echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
                  fi
                  echo "build-number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

    linux:
        needs: version
        if: needs.version.outputs.version != ''
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: x86_64
                    - runner: ubuntu-24.04-arm
                      arch: aarch64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: dtolnay/rust-toolchain@stable
            - run: scripts/set-version.sh ${{ needs.version.outputs.version }}
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libfuse2 file
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --release -p randomon -p randomon-cli
            - name: Package AppImage
              env:
                  VERSION: ${{ needs.version.outputs.version }}
                  ARCH: ${{ matrix.arch }}
              run: |
                  mkdir -p dist
                  APPDIR=build/randomon.AppDir
                  mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/512x512/apps" "$APPDIR/usr/share/metainfo" "$APPDIR/usr/share/applications"
                  cp target/release/randomon target/release/randomon-cli "$APPDIR/usr/bin/"
                  cp package/linux/randomon.desktop "$APPDIR/"
                  cp package/linux/randomon.desktop "$APPDIR/usr/share/applications/"
                  cp package/linux/dev.adrian.randomon.metainfo.xml "$APPDIR/usr/share/metainfo/"
                  cp assets/icon-512.png "$APPDIR/randomon.png"
                  cp assets/icon-512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/randomon.png"
                  cp package/linux/AppRun "$APPDIR/AppRun"
                  curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
                  chmod +x appimagetool
                  ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/randomon-$VERSION-linux-$ARCH.AppImage"
            - uses: actions/upload-artifact@v7
              with:
                  name: linux-${{ matrix.arch }}
                  path: dist/*

    windows:
        needs: version
        if: needs.version.outputs.version != ''
        strategy:
            matrix:
                include:
                    - runner: windows-latest
                      arch: x86_64
                      target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      arch: arm64
                      target: aarch64-pc-windows-msvc
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - run: bash scripts/set-version.sh ${{ needs.version.outputs.version }}
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --release -p randomon -p randomon-cli --target ${{ matrix.target }}
            - name: Collect binaries
              shell: bash
              run: |
                  mkdir -p "dist/${{ matrix.arch }}"
                  cp "target/${{ matrix.target }}/release/randomon.exe" "target/${{ matrix.target }}/release/randomon-cli.exe" "dist/${{ matrix.arch }}/"
            - uses: actions/upload-artifact@v7
              with:
                  name: windows-binaries-${{ matrix.arch }}
                  path: dist/

    windows-installer:
        needs: [version, windows]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: actions/download-artifact@v8
              with:
                  pattern: windows-binaries-*
                  path: build/nsis
                  merge-multiple: true
            - name: Install NSIS
              run: choco install nsis -y
            - name: Build the installer
              shell: pwsh
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  New-Item -ItemType Directory -Force -Path dist | Out-Null
                  Copy-Item package/windows/installer.nsi, assets/icon.ico build/nsis/
                  & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPPVERSION=$env:VERSION" build/nsis/installer.nsi
                  Move-Item build/nsis/installer.exe "dist/randomon-$env:VERSION-windows-setup.exe"
            - uses: actions/upload-artifact@v7
              with:
                  name: windows
                  path: dist/*

    macos:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin, x86_64-apple-darwin
            - run: scripts/set-version.sh ${{ needs.version.outputs.version }}
            - uses: Swatinem/rust-cache@v2
            - name: Build universal binaries
              run: |
                  cargo build --release -p randomon -p randomon-cli --target aarch64-apple-darwin
                  cargo build --release -p randomon -p randomon-cli --target x86_64-apple-darwin
                  mkdir -p build/universal
                  for binary in randomon randomon-cli; do
                    lipo -create \
                      "target/aarch64-apple-darwin/release/$binary" \
                      "target/x86_64-apple-darwin/release/$binary" \
                      -output "build/universal/$binary"
                  done

            - name: Assemble app bundle
              env:
                  VERSION: ${{ needs.version.outputs.version }}
                  BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
              run: |
                  APP=build/randomon.app
                  mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
                  cp build/universal/randomon "$APP/Contents/MacOS/randomon"
                  cp build/universal/randomon-cli "$APP/Contents/MacOS/randomon-cli"
                  cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
                  sed -e "s/__VERSION__/$VERSION/" -e "s/__BUILD__/$BUILD_NUMBER/" package/macos/Info.plist > "$APP/Contents/Info.plist"

            - name: Register the bundle ID
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  BUNDLE_IDENTIFIER: dev.adrian.randomon
              run: |
                  python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" requests
                  python3 package/macos/register_bundle_id.py

            - name: Fetch Signing Assets
              uses: castdrian/setup-apple-certificate@main
              id: cert
              with:
                  app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  distribution-private-key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
                  bundle-identifier: dev.adrian.randomon
                  certificate-type: DEVELOPER_ID

            - name: Install Signing Assets
              env:
                  P12_FILE_BASE64: ${{ steps.cert.outputs.p12-certificate-base64 }}
                  P12_PASSWORD: ${{ steps.cert.outputs.p12-password }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/randomon-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
                  P12_PATH="$RUNNER_TEMP/randomon-signing.p12"
                  echo "$P12_FILE_BASE64" | base64 --decode > "$P12_PATH"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import "$P12_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -P "$P12_PASSWORD"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
                  rm -f "$P12_PATH"

            - name: Sign app
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  APP=build/randomon.app
                  codesign --force --options runtime --timestamp --entitlements package/macos/entitlements.plist --sign "$IDENTITY" "$APP/Contents/MacOS/randomon-cli"
                  codesign --force --options runtime --timestamp --entitlements package/macos/entitlements.plist --sign "$IDENTITY" "$APP"
                  codesign --verify --deep --strict --verbose=2 "$APP"

            - name: Notarize and staple app
              run: |
                  trap 'rm -f /tmp/notary_key.p8' EXIT
                  echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}" | base64 --decode > /tmp/notary_key.p8
                  /usr/bin/ditto -c -k --keepParent build/randomon.app build/notarize-submit.zip
                  xcrun notarytool submit build/notarize-submit.zip \
                    --key /tmp/notary_key.p8 \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple build/randomon.app

            - name: Package DMG and CLI
              env:
                  VERSION: ${{ needs.version.outputs.version }}
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  mkdir -p dist build/dmg
                  cp -R build/randomon.app build/dmg/
                  ln -s /Applications build/dmg/Applications
                  DMG="dist/randomon-$VERSION-macos.dmg"
                  hdiutil create -volname "randomon" -srcfolder build/dmg -ov -format UDZO "$DMG"
                  codesign --force --timestamp --sign "$IDENTITY" "$DMG"

            - name: Notarize and staple DMG
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  trap 'rm -f /tmp/notary_key.p8' EXIT
                  echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}" | base64 --decode > /tmp/notary_key.p8
                  DMG="dist/randomon-$VERSION-macos.dmg"
                  xcrun notarytool submit "$DMG" \
                    --key /tmp/notary_key.p8 \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple "$DMG"

            - uses: actions/upload-artifact@v7
              with:
                  name: macos-universal
                  path: dist/*

            - name: Remove Signing Assets
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/randomon-signing.keychain-db" || true

    publish:
        needs: [version, linux, windows-installer, macos]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@stable
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  pattern: "{linux-*,windows,macos-universal}"
                  merge-multiple: true
            - name: Publish the release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: $SEMANTIC_RELEASE
