[workspace]
resolver = "3"
members = [
    "apps/randomon",
    "apps/randomon-cli",
    "crates/randomon_java",
    "crates/randomon_formats",
    "crates/randomon_data",
    "crates/randomon_settings",
    "crates/randomon_core",
    "crates/randomon_log",
    "crates/randomon_gb",
    "crates/randomon_gen1",
    "crates/randomon_gen2",
    "crates/randomon_gen3",
    "crates/randomon_nds",
    "crates/randomon_gen4",
    "crates/randomon_gen5",
    "crates/randomon_ctr",
    "crates/randomon_gen6",
    "crates/randomon_gen7",
    "crates/randomon_unity",
    "crates/randomon_bdsp",
    "crates/randomon_fuzz",
]
default-members = ["apps/randomon"]

[workspace.package]
edition = "2024"
version = "1.2.2"
authors = ["castdrian"]
license = "GPL-3.0-or-later"
repository = "https://github.com/castdrian/randomon"
rust-version = "1.90"

[workspace.dependencies]
randomon_java = { path = "crates/randomon_java" }
randomon_formats = { path = "crates/randomon_formats" }
randomon_data = { path = "crates/randomon_data" }
randomon_settings = { path = "crates/randomon_settings" }
randomon_core = { path = "crates/randomon_core" }
randomon_log = { path = "crates/randomon_log" }
randomon_gb = { path = "crates/randomon_gb" }
randomon_gen1 = { path = "crates/randomon_gen1" }
randomon_gen2 = { path = "crates/randomon_gen2" }
randomon_gen3 = { path = "crates/randomon_gen3" }
randomon_nds = { path = "crates/randomon_nds" }
randomon_gen4 = { path = "crates/randomon_gen4" }
randomon_gen5 = { path = "crates/randomon_gen5" }
randomon_ctr = { path = "crates/randomon_ctr" }
randomon_gen6 = { path = "crates/randomon_gen6" }
randomon_gen7 = { path = "crates/randomon_gen7" }
randomon_unity = { path = "crates/randomon_unity" }
randomon_bdsp = { path = "crates/randomon_bdsp" }
thiserror = "2.0"
base64 = "0.23"
crc32fast = "1.5"
indexmap = "2.14"
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"

[profile.fuzz]
inherits = "release"
debug = "line-tables-only"
strip = "none"
lto = false
codegen-units = 16

[profile.dev.package.randomon_formats]
opt-level = 3

[patch.crates-io]
block = { path = "vendor/block" }
